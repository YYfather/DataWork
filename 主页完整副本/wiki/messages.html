<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>消息队列 · 实验记录 · 霡霂</title>
<meta name="description" content="实验评论消息队列">
<meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../avatar.jpg">
<link rel="apple-touch-icon" href="../avatar.jpg">
<style>
:root{--c-primary:#6366f1;--c-primary2:#a78bfa;--c-bg:#f8f7ff;--c-card:rgba(255,255,255,0.72);--c-text:#1e1b2e;--c-text2:#6b7280;--c-border:rgba(255,255,255,0.45);--shadow:0 8px 32px rgba(99,102,241,0.1);--radius:16px;--blur:20px}
[data-theme="dark"]{--c-primary:#818cf8;--c-primary2:#c4b5fd;--c-bg:#08080f;--c-card:rgba(24,22,38,0.72);--c-text:#eae8f2;--c-text2:#9ca3af;--c-border:rgba(255,255,255,0.06);--shadow:0 8px 32px rgba(0,0,0,0.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'SF Pro Display','Segoe UI','Microsoft YaHei',system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;min-height:100dvh;transition:background .5s,color .4s;overflow-x:hidden;-webkit-font-smoothing:antialiased}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-mesh{position:absolute;inset:0;background:radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99,102,241,0.15), transparent),radial-gradient(ellipse 500px 500px at 80% 70%, rgba(167,139,250,0.12), transparent),radial-gradient(ellipse 400px 300px at 50% 50%, rgba(16,185,129,0.08), transparent);animation:meshShift 25s ease-in-out infinite alternate}
@keyframes meshShift{0%{background-position:0% 0%,100% 100%,50% 50%}50%{background-position:30% 20%,70% 80%,40% 60%}100%{background-position:10% 40%,90% 30%,60% 40%}}
.bg-grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px}
[data-theme="dark"] .bg-mesh{background:radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99,102,241,0.08), transparent),radial-gradient(ellipse 500px 500px at 80% 70%, rgba(167,139,250,0.06), transparent),radial-gradient(ellipse 400px 300px at 50% 50%, rgba(16,185,129,0.04), transparent)}

.page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:48px 24px calc(40px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;animation:fadeUp .5s ease-out}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--c-text2);text-decoration:none;transition:color .2s}
.back:hover{color:var(--c-primary)}

.theme-btn{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:none;background:var(--c-card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:all .25s;display:flex;align-items:center;justify-content:center;z-index:100;border:1px solid var(--c-border)}
.theme-btn:hover{transform:scale(1.1) rotate(20deg)}

.header{margin-bottom:24px;animation:fadeUp .5s ease-out .05s both}
.header h1{font-size:1.5rem;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.header p{font-size:14px;color:var(--c-text2)}
.header .badge{display:inline-block;padding:1px 10px;border-radius:10px;font-size:12px;background:rgba(99,102,241,0.1);color:var(--c-primary);margin-left:8px}

.msg-list{display:flex;flex-direction:column;gap:12px;flex:1;animation:fadeUp .5s ease-out .1s both}
.msg-item{padding:16px 18px;background:var(--c-card);backdrop-filter:blur(var(--blur));border:1px solid var(--c-border);border-radius:var(--radius);box-shadow:var(--shadow);transition:all .2s}
.msg-item:hover{border-color:rgba(99,102,241,0.2)}
.msg-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.msg-exp{font-size:12px;font-weight:500;color:var(--c-primary);cursor:pointer;text-decoration:none}
.msg-exp:hover{text-decoration:underline}
.msg-time{font-size:11px;color:var(--c-text2)}
.msg-text{font-size:14px;line-height:1.6;margin-bottom:6px}
.msg-labels{display:flex;gap:4px;flex-wrap:wrap}
.msg-labels .cl{padding:1px 8px;border-radius:6px;font-size:10px;font-weight:500}
.cl-todo{background:rgba(99,102,241,0.1);color:var(--c-primary)}
.cl-q{background:rgba(245,158,11,0.1);color:#d97706}
.cl-imp{background:rgba(239,68,68,0.1);color:#dc2626}
.cl-done{background:rgba(16,185,129,0.1);color:#059669}

.empty-state{text-align:center;padding:60px 20px;animation:fadeUp .5s ease-out}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state h3{font-size:1.1rem;margin-bottom:6px}
.empty-state p{color:var(--c-text2);font-size:14px}

.footer{margin-top:auto;padding-top:36px;text-align:center;font-size:12px;color:var(--c-text2);opacity:.4;animation:fadeUp .5s ease-out .3s both}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media(max-width:480px){.page{padding:36px 16px}}

/* Navigation */
.floating-back{position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;border:1px solid var(--c-border);background:var(--c-card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:90;transition:all .25s;color:var(--c-text2)}
.floating-back:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(99,102,241,0.2);border-color:var(--c-primary);color:var(--c-primary)}
@media(max-width:480px){.floating-back{bottom:calc(16px + env(safe-area-inset-bottom));right:16px;width:44px;height:44px;font-size:18px}}

/* Skip Link */
.skip-link{position:absolute;top:-40px;left:0;background:var(--c-primary);color:white;padding:8px 16px;z-index:100;transition:top 0.3s;text-decoration:none;border-radius:0 0 8px 0;font-size:14px}
.skip-link:focus{top:0}
</style>
</head>
<body>

<a href="#main-content" class="skip-link">跳到主要内容</a>

<div class="bg"><div class="bg-mesh"></div><div class="bg-grain"></div></div>
<button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌓</button>

<div class="page">
<main id="main-content">
  <div class="topbar">
    <a class="back" href="../">← 主页</a>
    <span style="color:var(--c-text2);opacity:.4;margin:0 2px">›</span>
    <a class="back" href="./">Wiki 首页</a>
    <span style="color:var(--c-text2);opacity:.4;margin:0 2px">›</span>
    <a class="back" href="./experiments.html">实验记录</a>
  </div>

  <div class="header">
    <h1>💬 消息队列 <span class="badge" id="totalBadge">0</span></h1>
    <p>所有实验的最新评论动态，按时间倒序排列</p>
  </div>

  <div class="msg-list" id="msgList"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">💬</div>
    <h3>暂无消息</h3>
    <p>在实验记录页面底部可以添加评论</p>
  </div>

  <div class="footer">© 2026 霡霂 · 消息队列</div>
</main>
</div>

<script>
function toggleTheme(){const b=document.body;if(b.getAttribute('data-theme')==='dark'){b.removeAttribute('data-theme');localStorage.setItem('hp_theme','light')}else{b.setAttribute('data-theme','dark');localStorage.setItem('hp_theme','dark')}}
if(localStorage.getItem('hp_theme')==='dark')document.body.setAttribute('data-theme','dark');

var expLookup = {};

async function load(){
  try{
    // 1. Load experiments for title lookup
    var expResp = await fetch('./experiments/api.php');
    var exps = await expResp.json();
    exps.forEach(function(e){ expLookup[e.id] = e; });

    // 2. Load all messages
    var msgResp = await fetch('./experiments/api-messages.php');
    var msgs = await msgResp.json();
    render(msgs);
  }catch(e){
    document.getElementById('msgList').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><h3>加载失败</h3><p>' + escHtml(e.message) + '</p></div>';
  }
}

function render(msgs){
  document.getElementById('totalBadge').textContent = msgs.length;

  var list = document.getElementById('msgList');
  var empty = document.getElementById('emptyState');

  if(msgs.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  var labelMap = {'待办':'cl-todo','疑问':'cl-q','重要':'cl-imp','已处理':'cl-done'};
  var html = '';

  msgs.forEach(function(m){
    var exp = expLookup[m.expId];
    var expTitle = exp ? exp.title : m.expId;
    var project = exp ? exp.project : '';

    html += '<div class="msg-item">';
    html += '<div class="msg-header">';
    html += '<a class="msg-exp" href="./viewer.html?page=experiments/' + encodeURIComponent(exp ? exp.path : m.expId) + '">' + escHtml(expTitle) + '</a>';
    if(project) html += '<span style="font-size:11px;color:var(--c-text2)">· ' + escHtml(project) + '</span>';
    html += '<span class="msg-time">' + escHtml(m.createdAt.replace('T', ' ')) + '</span>';
    html += '</div>';
    html += '<div class="msg-text">' + escHtml(m.text) + '</div>';
    if(m.labels && m.labels.length){
      html += '<div class="msg-labels">';
      m.labels.forEach(function(l){ var cls=labelMap[l]||'cl-todo'; html += '<span class="cl '+cls+'">#'+escHtml(l)+'</span>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  list.innerHTML = html;
}

function escHtml(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

load();

// Escape key: navigate back to experiments
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') window.location.href = './experiments.html';
});
</script>
<!-- Floating Back Button -->
<button class="floating-back" onclick="window.location.href='./experiments.html'" title="返回实验记录 (Esc)">←</button>
</body>
</html>
