<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 - 页面未找到 | 霡霂</title>
<link rel="icon" href="avatar.jpg">
<link rel="apple-touch-icon" href="avatar.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-primary:rgba(255,255,255,0.85);
  --bg-card:rgba(255,255,255,0.6);
  --text-primary:#1a1a2e;
  --text-secondary:#666;
  --accent:#6c5ce7;
  --accent-light:#a29bfe;
  --border:rgba(255,255,255,0.3);
  --shadow:0 8px 32px rgba(0,0,0,0.1);
}
[data-theme="dark"]{
  --bg-primary:rgba(26,26,46,0.9);
  --bg-card:rgba(45,45,80,0.6);
  --text-primary:#e0e0ff;
  --text-secondary:#a0a0c0;
  --accent:#a29bfe;
  --accent-light:#6c5ce7;
  --border:rgba(255,255,255,0.1);
  --shadow:0 8px 32px rgba(0,0,0,0.3);
}
body{
  font-family:'SF Pro Display','Segoe UI','Microsoft YaHei',system-ui,sans-serif;
  background:#0a0a1a;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}
/* 渐变背景 */
.bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:0;
  overflow:hidden;
}
.bg-mesh{
  position:absolute;
  width:200%;height:200%;
  top:-50%;left:-50%;
  background:
    radial-gradient(circle at 30% 20%,rgba(108,92,231,0.3) 0%,transparent 50%),
    radial-gradient(circle at 70% 80%,rgba(0,206,209,0.2) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(255,107,107,0.15) 0%,transparent 50%);
  animation:meshShift 25s ease-in-out infinite;
}
@keyframes meshShift{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(-5%,3%) rotate(1deg)}
  66%{transform:translate(3%,-5%) rotate(-1deg)}
}
.bg-grain{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}
/* 卡片 */
.card{
  position:relative;
  z-index:1;
  background:var(--bg-card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px;
  max-width:480px;
  width:90%;
  text-align:center;
  box-shadow:var(--shadow);
  animation:fadeUp 0.6s ease-out;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:none}
}
/* 404 数字 */
.error-code{
  font-size:120px;
  font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent-light),#00cec9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
  margin-bottom:16px;
  text-shadow:0 0 80px rgba(108,92,231,0.3);
}
/* 图标 */
.icon{
  font-size:64px;
  margin-bottom:24px;
  display:block;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
/* 文字 */
h1{
  color:var(--text-primary);
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
}
p{
  color:var(--text-secondary);
  font-size:16px;
  line-height:1.6;
  margin-bottom:32px;
}
/* 按钮 */
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:14px 32px;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  transition:all 0.3s ease;
  border:none;
  cursor:pointer;
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(108,92,231,0.4);
}
.btn:active{
  transform:translateY(0);
}
/* 主题切换 */
.theme-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:10;
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--bg-card);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);
  cursor:pointer;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
}
.theme-btn:hover{
  transform:scale(1.1);
  background:var(--bg-primary);
}
/* 链接 */
.links{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:24px;
}
.link{
  color:var(--accent);
  text-decoration:none;
  font-size:14px;
  padding:8px 16px;
  border-radius:8px;
  border:1px solid var(--border);
  transition:all 0.3s ease;
}
.link:hover{
  background:var(--bg-card);
  border-color:var(--accent);
}
/* 响应式 */
@media(max-width:480px){
  .card{padding:32px 24px}
  .error-code{font-size:80px}
  h1{font-size:20px}
  .icon{font-size:48px}
}
/* 无障碍 */
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* Skip Link */
.skip-link{position:absolute;top:-40px;left:0;background:var(--accent);color:white;padding:8px 16px;z-index:100;transition:top 0.3s;text-decoration:none;border-radius:0 0 8px 0;font-size:14px}
.skip-link:focus{top:0}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">跳到主要内容</a>
<div class="bg">
  <div class="bg-mesh"></div>
  <div class="bg-grain"></div>
</div>

<button class="theme-btn" onclick="toggleTheme()" aria-label="切换主题">🌙</button>

<div class="card" id="main-content">
  <span class="icon">🌧️</span>
  <div class="error-code">404</div>
  <h1>页面走丢了</h1>
  <p>你要找的页面可能已被移除、更名，或者暂时不可用。</p>
  <a href="/" class="btn">
    <span>🏠</span>
    <span>返回首页</span>
  </a>
  <div class="links">
    <a href="/vault/" class="link">🔒 保险箱</a>
    <a href="/wiki/" class="link">📖 Wiki</a>
    <a href="/english/" class="link">📝 英语</a>
  </div>
</div>

<script>
// 主题切换
function toggleTheme(){
  const html=document.documentElement;
  const current=html.getAttribute('data-theme');
  const next=current==='dark'?'light':'dark';
  html.setAttribute('data-theme',next);
  localStorage.setItem('hp_theme',next);
  document.querySelector('.theme-btn').textContent=next==='dark'?'🌙':'☀️';
}

// 初始化主题
(function(){
  const saved=localStorage.getItem('hp_theme');
  if(saved){
    document.documentElement.setAttribute('data-theme',saved);
    document.querySelector('.theme-btn').textContent=saved==='dark'?'🌙':'☀️';
  }
})();
</script>
</body>
</html>
