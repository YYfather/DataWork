[package]
name = "datawork-desktop"
version = "1.7.0"
description = "DataWork cross-platform desktop shell"
authors = ["DataWork"]
edition = "2021"

[lib]
name = "datawork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
