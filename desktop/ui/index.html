<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataWork 正在启动</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f5f7fa; color: #172033; }
    main { width: min(520px, 84vw); padding: 34px; border-radius: 18px; background: white; box-shadow: 0 18px 60px rgba(30,45,70,.12); }
    h1 { margin: 0 0 12px; } p { color: #5f6878; line-height: 1.7; } progress { width: 100%; }
    .error { color: #9d2f2f; }
  </style>
</head>
<body>
<main>
  <h1>DataWork</h1>
  <p id="status">正在启动本地统计服务并检查工作区……</p>
  <progress></progress>
</main>
<script>
  const status = document.getElementById('status');
  let attempts = 0;
  async function probe() {
    attempts += 1;
    try {
      const response = await fetch('http://127.0.0.1:8765/api/health', { cache: 'no-store' });
      if (response.ok) {
        window.location.replace('http://127.0.0.1:8765/');
        return;
      }
    } catch (_) {}
    if (attempts >= 60) {
      status.className = 'error';
      status.textContent = '本地服务未能启动。请查看应用日志，或使用浏览器模式运行 DataWork。';
      return;
    }
    status.textContent = `正在等待本地统计服务……（${attempts}/60）`;
    setTimeout(probe, 500);
  }
  probe();
</script>
</body>
</html>
