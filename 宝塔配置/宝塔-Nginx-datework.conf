# DataWork 个人主页子路径配置片段
# 使用方法：将本文件内容放进 1490473838.cn 当前 HTTPS 站点的 server { ... } 内。
# 当前站点是 PHP 项目：保留现有 root、index、PHP FastCGI 和其它 location 配置，
# 不要在宝塔中把站点类型改为 Python 项目，也不要用本文件覆盖整个站点配置。
# ^~ 会让 Nginx 优先处理 /datework/，不会落入原站点的 PHP 正则 location。
# 本文件不能放进任何其它 location { ... } 内。
# DataWork 运行文件可迁移地放在 /www/wwwroot/1490473838.cn/datework/；这三个
# location 会将该路径全部代理给本机服务，因此 Nginx 不会直接提供其中的源码、.venv 或 data。
# 配套主页副本的 sw.js 已把 /datework/ 加入子应用放行列表。

location = /datework {
    return 301 https://$host/datework/;
}

# API 单独禁止缓存，避免项目、报告和运行状态被个人主页缓存复用。
location ^~ /datework/api/ {
    client_max_body_size 110m;
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /datework;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# 页面和带哈希的静态资源。
location ^~ /datework/ {
    client_max_body_size 110m;
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /datework;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_redirect off;
}
