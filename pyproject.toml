[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datawork"
version = "1.7.1"
description = "跨平台实验统计分析与可复现报告平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
]

[project.optional-dependencies]
legacy-excel = ["xlrd>=2.0"]
desktop-build = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
datawork = "datawork.cli:app"
datawork-web = "datawork.web.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datawork*"]

[tool.setuptools.package-data]
"datawork.web" = ["static/index.html", "static/assets/*"]
"datawork.report" = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
